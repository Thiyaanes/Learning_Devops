apiVersion: apps/v1
kind :  Deployment
metadata:
  name: appname
spec:
  replicas : 3
  selector:
    matchLabels:
      app: appname
  template:
    metadata:
      labels:
        app: appname
    spec:
      containers:
        - name: appname
          image: nginx
          # env:
          #   - name: APP_message
          #     value: "Hello from myapp"
          #   - name: DB_password
          #     value: "mysecretpassword"
          env:
            - name: APP_Message
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_Message
            - name: DB_password
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_password
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  selector:
    app: myapp
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000
    