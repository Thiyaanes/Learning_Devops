name: env_secrets
on:
    # push:
    # pull_request:
    workflow_dispatch:
env: 
  Global_App_env: Glabal level environment variable
jobs:
    second_build:
        runs-on: ubuntu-latest
        env: 
          Job_App_env: Job level environment variable
        steps:
            - uses: actions/checkout@v4

            - name: Run a one-line script
              run: echo Hello, world!

            - name: environment secrets and IP address
              env: 
                App_env: demo
              run: echo Environment $App_env

            - name: environment secrets in github
              env: 
                App_env1: demo
                GITHUB_ENV: ${{ secrets.SECRET_PASSWORD }}
              run: echo Environment $App_env1 using $GITHUB_ENV, $Global_App_env, $Job_App_env

            - name: create demo artifact
              run: echo "This is a demo artifact" > demo.txt

            - name: upload_demo
              uses: actions/upload-artifact@v7
              with:
                name: demo artifact
                path: demo.txt
              

              