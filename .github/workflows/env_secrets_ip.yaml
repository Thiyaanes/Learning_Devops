name: env_secrets
on:
    # push:
    # pull_request:
    workflow_dispatch:
jobs:
    second_build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Run a one-line script
              run: echo Hello, world!

            - name: environment secrets and IP address
              env: 
                App_env: demo
              run: echo Environment $App_env

            - name: environment secrets in github
              env: 
                App_env: demo
                GITHUB_ENV: ${{ secrets.SECRET_PASSWORD }}
              run: echo Environment $App_env using $GITHUB_ENV
