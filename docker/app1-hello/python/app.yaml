apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyapp
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: pyapp
  template:
      metadata:
        labels:
          app: pyapp
      spec:
        containers:
          - name: pyapp
            image: thiyaanes/createpyimg
            env:
              - name: ENV_VALUE
                valueFrom:
                  configMapKeyRef:
                    name: app-config
                    key: APP_Message
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: app-secret
                    key: db_password
            ports:
              - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: pyapp
spec:
  selector:
      app: pyapp
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 32001

